<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2E7D32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4CAF50;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="houseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5F5F5;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Rectangle Background -->
  <rect x="0" y="0" width="1024" height="1024" rx="180" ry="180" fill="url(#bgGradient)"/>
  
  <!-- Main House Structure -->
  <g transform="translate(512, 512)">
    <!-- House Base -->
    <rect x="-160" y="-80" width="320" height="240" rx="20" ry="20" fill="url(#houseGradient)" stroke="#E0E0E0" stroke-width="4"/>
    
    <!-- Roof -->
    <polygon points="-200,-80 0,-200 200,-80" fill="#FF7043" stroke="#F57C00" stroke-width="4"/>
    
    <!-- Door -->
    <rect x="-40" y="40" width="80" height="120" rx="8" ry="8" fill="#2E7D32" stroke="#1B5E20" stroke-width="2"/>
    
    <!-- Door Handle -->
    <circle cx="20" cy="100" r="6" fill="#FFD700"/>
    
    <!-- Windows -->
    <rect x="-130" y="-20" width="60" height="60" rx="8" ry="8" fill="#81C784" stroke="#4CAF50" stroke-width="2"/>
    <rect x="70" y="-20" width="60" height="60" rx="8" ry="8" fill="#81C784" stroke="#4CAF50" stroke-width="2"/>
    
    <!-- Window Frames -->
    <line x1="-130" y1="10" x2="-70" y2="10" stroke="#2E7D32" stroke-width="2"/>
    <line x1="-100" y1="-20" x2="-100" y2="40" stroke="#2E7D32" stroke-width="2"/>
    <line x1="70" y1="10" x2="130" y2="10" stroke="#2E7D32" stroke-width="2"/>
    <line x1="100" y1="-20" x2="100" y2="40" stroke="#2E7D32" stroke-width="2"/>
    
    <!-- Chimney -->
    <rect x="120" y="-160" width="30" height="80" fill="#8D6E63" stroke="#5D4037" stroke-width="2"/>
  </g>
  
  <!-- HomeVZ Text -->
  <text x="512" y="900" font-family="Arial, sans-serif" font-size="72" font-weight="bold" text-anchor="middle" fill="#FFFFFF">HomeVZ</text>
</svg>
